<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questionario mattutino</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stile.css">
</head>
<body>
<div class="wrap">
  <h1>Questionario mattutino</h1>

  <div id="erroreLink" class="card" hidden>
    <p class="errore" id="testoErroreLink"></p>
  </div>

  <div id="formEmail" class="card" hidden>
    <label for="campoEmail">Conferma la tua email per accedere</label>
    <input type="email" id="campoEmail" placeholder="nome@esempio.it" autocomplete="email">
    <p class="errore" id="erroreEmail" hidden></p>
    <p style="margin-top:14px"><button class="btn primary" id="bVerifica">Continua</button></p>
  </div>

  <div id="questionario" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="questionario.js"></script>
</body>
</html>
